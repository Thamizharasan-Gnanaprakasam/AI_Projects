name: Build VoiceInk (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build VoiceInk on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Wispr_Flow_Alt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            asset_name: VoiceInk-macOS
          - os: windows-latest
            platform: windows
            asset_name: VoiceInk-Windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Wispr_Flow_Alt/requirements.txt'

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build macOS App (.app)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean -y VoiceInk.spec
          cd dist
          ditto -c -k --sequesterRsrc --keepParent VoiceInk.app VoiceInk-macOS.zip

      - name: Build Windows App (.exe)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean -y VoiceInk_win.spec
          Compress-Archive -Path dist\VoiceInk\* -DestinationPath dist\VoiceInk-Windows.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            Wispr_Flow_Alt/dist/*.zip
          retention-days: 14
